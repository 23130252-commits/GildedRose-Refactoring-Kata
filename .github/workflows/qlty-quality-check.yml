name: Code Quality Analysis (Qlty.sh)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Build Java project
        run: cd Java && mvn clean install -DskipTests

      - name: Install Qlty CLI
        run: |
          curl -sSfL https://qlty.sh/install.sh | bash
          echo "$HOME/.qlty/bin" >> $GITHUB_PATH

      - name: Verify Qlty installation
        run: which qlty && qlty --version

      - name: Run Qlty Analysis
        env:
          QLTY_API_KEY: ${{ secrets.QLTY_API_KEY }}
        run: qlty analyze --no-progress

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: qlty-analysis
          path: .qlty/
