name: Code Quality Analysis (Qlty.sh)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  code-quality:
    name: Qlty.sh Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('Java/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Java project with Maven
        run: cd Java && mvn clean install -DskipTests

      - name: Install Qlty CLI
        run: curl -fsSL https://qlty.sh/install | bash

      - name: Run Qlty analysis
        env:
          QLTY_API_KEY: ${{ secrets.QLTY_API_KEY }}
        run: |
          export PATH="$HOME/.qlty/bin:$PATH"
          qlty analyze --no-progress

      - name: Upload Qlty quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qlty-report
          path: .qlty/
          if-no-files-found: ignore
